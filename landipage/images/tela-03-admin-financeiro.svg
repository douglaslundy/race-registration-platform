    <g stroke="#e5e7eb"><line x1="20" y1="170" x2="1180" y2="170"/><line x1="20" y1="130" x2="1180" y2="130"/><line x1="20" y1="90" x2="1180" y2="90"/><line x1="20" y1="50" x2="1180" y2="50"/></g>
    <polyline points="20,140 140,150 260,120 380,135 500,100 620,110 740,80 860,95 980,60 1100,75 1180,50" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
