<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, Arial, sans-serif">
  <rect width="1280" height="820" rx="16" fill="#f9fafb"/>
  <rect width="1280" height="40" rx="16" fill="#e5e7eb"/>
  <circle cx="24" cy="20" r="6" fill="#f87171"/><circle cx="46" cy="20" r="6" fill="#fbbf24"/><circle cx="68" cy="20" r="6" fill="#34d399"/>
  <rect x="470" y="10" width="340" height="20" rx="10" fill="#ffffff"/>
  <text x="640" y="24" font-size="12" fill="#6b7280" text-anchor="middle">corridasapp.com.br/admin/anuncios</text>

  <rect x="0" y="40" width="1280" height="48" fill="#111827"/>
  <text x="32" y="70" font-size="13" fill="#d1d5db">Dashboard</text>
  <text x="650" y="70" font-size="13" fill="#d1d5db">Campanhas</text>
  <text x="730" y="70" font-size="13" fill="#facc15" font-weight="700">Anúncios</text>
  <text x="800" y="70" font-size="13" fill="#d1d5db">Solicitações</text>

  <text x="40" y="128" font-size="20" font-weight="700" fill="#111827">Anúncios</text>
  <rect x="700" y="106" width="190" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="795" y="126" font-size="11" fill="#374151" text-anchor="middle">Conectar Google AdSense</text>
  <rect x="900" y="106" width="110" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="955" y="126" font-size="11" fill="#374151" text-anchor="middle">Métricas</text>
  <rect x="1020" y="106" width="100" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1070" y="126" font-size="11" fill="#374151" text-anchor="middle">Planos</text>
  <rect x="1130" y="106" width="110" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1185" y="126" font-size="11" fill="#374151" text-anchor="middle">Moderação</text>

  <!-- google adsense client id -->
  <g transform="translate(40,156)">
    <rect width="1200" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="20" y="26" font-size="11" font-weight="600" fill="#374151">Client ID do Google AdSense</text>
    <rect x="20" y="36" width="360" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="30" y="54" font-size="11" fill="#9ca3af">ca-pub-XXXXXXXXXXXXXXXX</text>
    <rect x="392" y="36" width="80" height="28" rx="6" fill="#2563eb"/>
    <text x="432" y="54" font-size="11" fill="#ffffff" text-anchor="middle">Salvar</text>
  </g>

  <!-- ad slots list (real /admin/anuncios structure) -->
  <g transform="translate(40,250)">
    <rect width="1200" height="520" rx="10" fill="#ffffff" stroke="#e5e7eb"/>

    <g transform="translate(20,20)">
      <text font-size="13" font-weight="700" fill="#111827">Topo da home (banner)</text>
      <text y="18" font-size="10" fill="#9ca3af">970×250px — EVENTOS_ABAIXO_BANNER</text>
      <rect x="900" y="-16" width="70" height="22" rx="11" fill="#dcfce7"/>
      <text x="935" y="0" font-size="10" fill="#166534" text-anchor="middle">Ativado</text>
      <text x="990" y="0" font-size="11" fill="#374151">Fonte:</text>
      <rect x="1030" y="-16" width="130" height="22" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
      <text x="1040" y="0" font-size="10" fill="#374151">Google AdSense</text>
      <line x1="0" y1="34" x2="1160" y2="34" stroke="#f3f4f6"/>
    </g>

    <g transform="translate(20,96)">
      <text font-size="13" font-weight="700" fill="#111827">Coluna esquerda — lista de eventos</text>
      <text y="18" font-size="10" fill="#9ca3af">300×600px — EVENTOS_COLUNA_ESQUERDA</text>
      <rect x="900" y="-16" width="70" height="22" rx="11" fill="#dcfce7"/>
      <text x="935" y="0" font-size="10" fill="#166534" text-anchor="middle">Ativado</text>
      <text x="990" y="0" font-size="11" fill="#374151">Fonte:</text>
      <rect x="1030" y="-16" width="130" height="22" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
      <text x="1040" y="0" font-size="10" fill="#374151">Anúncio próprio</text>

      <g transform="translate(0,42)">
        <rect width="1160" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
        <rect x="12" y="12" width="100" height="46" rx="6" fill="#fed7aa"/>
        <text x="130" y="30" font-size="11" fill="#374151">Imagem do anúncio (upload)</text>
        <rect x="130" y="38" width="360" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="140" y="53" font-size="10" fill="#9ca3af">https://...</text>
        <text x="520" y="30" font-size="11" fill="#374151">Link de destino</text>
        <rect x="520" y="38" width="360" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="530" y="53" font-size="10" fill="#9ca3af">https://loja-parceira.com.br</text>
        <rect x="900" y="38" width="90" height="22" rx="4" fill="#2563eb"/>
        <text x="945" y="53" font-size="10" fill="#ffffff" text-anchor="middle">Salvar anúncio</text>
      </g>
      <line x1="0" y1="128" x2="1160" y2="128" stroke="#f3f4f6"/>
    </g>

    <g transform="translate(20,300)">
      <text font-size="13" font-weight="700" fill="#111827">Entre resultados da busca</text>
      <text y="18" font-size="10" fill="#9ca3af">728×90px — EVENTOS_ENTRE_RESULTADOS</text>
      <rect x="900" y="-16" width="90" height="22" rx="11" fill="#f3f4f6"/>
      <text x="945" y="0" font-size="10" fill="#374151" text-anchor="middle">Desativado</text>
      <text x="990" y="0" font-size="11" fill="#374151">Fonte:</text>
      <rect x="1030" y="-16" width="130" height="22" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
      <text x="1040" y="0" font-size="10" fill="#374151">Google AdSense</text>
      <line x1="0" y1="34" x2="1160" y2="34" stroke="#f3f4f6"/>
    </g>

    <g transform="translate(20,362)">
      <text font-size="13" font-weight="700" fill="#111827">Página do evento — rodapé</text>
      <text y="18" font-size="10" fill="#9ca3af">970×90px — EVENTO_RODAPE</text>
      <rect x="900" y="-16" width="70" height="22" rx="11" fill="#dcfce7"/>
      <text x="935" y="0" font-size="10" fill="#166534" text-anchor="middle">Ativado</text>
      <text x="990" y="0" font-size="11" fill="#374151">Fonte:</text>
      <rect x="1030" y="-16" width="130" height="22" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
      <text x="1040" y="0" font-size="10" fill="#374151">Google AdSense</text>
    </g>
  </g>
</svg>
